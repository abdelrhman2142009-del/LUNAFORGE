name: LUNAFORGE CI

on:
  push:
    branches: [main, member-5-integration-deliverables]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build production app
        run: npm run build
