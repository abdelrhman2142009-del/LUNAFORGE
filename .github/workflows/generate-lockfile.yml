name: Generate dependency lockfile

on:
  push:
    branches: [member-5-integration-deliverables]
    paths:
      - "package.json"
      - ".github/workflows/generate-lockfile.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: member-5-integration-deliverables
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if missing
        run: |
          if [ -f package-lock.json ]; then
            git add package-lock.json
            if git diff --cached --quiet; then
              echo "No lockfile changes to commit."
              exit 0
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: add reproducible npm lockfile"
            git push origin HEAD:member-5-integration-deliverables
          fi
